name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: mac-aarch64
          - os: macos-13
            artifact: mac-x64
          - os: windows-latest
            artifact: win-x64
          - os: ubuntu-22.04
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install WiX
        if: runner.os == 'Windows'
        run: choco install wixtoolset --version=3.14.1 -y

      - name: Install fakeroot
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build native package
        run: mvn -B -Pdist verify

      - uses: actions/upload-artifact@v4
        with:
          name: DeltaBlade-${{ matrix.artifact }}
          path: target/dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**

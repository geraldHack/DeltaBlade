name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: mac-aarch64
          - os: macos-13
            artifact: mac-x64
          - os: windows-latest
            artifact: win-x64
          - os: ubuntu-22.04
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Ensure WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = $null
          if ($env:WIX) {
            $bin = Join-Path $env:WIX "bin"
          }
          if (-not $bin -or -not (Test-Path (Join-Path $bin "light.exe"))) {
            $home = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*" -Directory -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($home) {
              $bin = Join-Path $home.FullName "bin"
              "WIX=$($home.FullName)\" >> $env:GITHUB_ENV
            }
          }
          if ($bin -and (Test-Path (Join-Path $bin "light.exe"))) {
            $bin >> $env:GITHUB_PATH
            Write-Host "Using WiX at $bin"
          } else {
            choco install wixtoolset -y --no-progress
          }

      - name: Install fakeroot
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build native package
        run: mvn -B -Pdist verify

      - uses: actions/upload-artifact@v4
        with:
          name: DeltaBlade-${{ matrix.artifact }}
          path: target/dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
